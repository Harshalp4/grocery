name: partner
description: "FarmFresh Partner — delivery rider app."
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  http: ^1.2.2
  shared_preferences: ^2.3.3
  # Open-source maps (OpenStreetMap tiles — no API key) + GPS
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  # Push notifications (FCM) — see PUSH_NOTIFICATIONS.md. Placeholder config
  # ships so the app builds; drop in a real google-services.json to enable.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
