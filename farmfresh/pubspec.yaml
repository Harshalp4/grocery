name: farmfresh
description: "FarmFresh — premium farm-to-home grocery delivery app."
publish_to: "none"
version: 1.0.2+6

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  http: ^1.2.2
  shared_preferences: ^2.3.3
  # Open-source maps (OpenStreetMap tiles — no API key)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  geolocator: ^13.0.1
  # Push notifications (FCM). Needs a Firebase project's google-services.json —
  # see PUSH_NOTIFICATIONS.md. A placeholder is shipped so the app still builds.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  # Social sign-in through Firebase Auth (Google + Apple). Needs the real
  # Firebase project config to work — see SOCIAL_SIGN_IN.md. Guarded so the app
  # builds/runs without it (buttons show a "not configured" message).
  firebase_auth: ^5.3.1
  google_sign_in: ^6.2.2
  sign_in_with_apple: ^6.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# App launcher icon generation (run: dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 24
  remove_alpha_ios: true
  adaptive_icon_background: "#2F6B46"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
