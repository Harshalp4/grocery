# Render Blueprint — deploys the .NET API + a managed Postgres together.
# In Render: New → Blueprint → pick this repo. Then set the "sync: false" secrets
# in the dashboard. See DEPLOYMENT.md.
services:
  - type: web
    name: farmfresh-api
    runtime: docker
    rootDir: backend-dotnet
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL          # parsed into an Npgsql connection string
        fromDatabase:
          name: farmfresh-db
          property: connectionString
      - key: Jwt__Secret           # strong signing key, generated once
        generateValue: true
      - key: Admin__Email
        value: admin@farmfresh.local
      - key: Admin__Password       # set your own in the dashboard
        sync: false
      - key: OTP_DEV_MODE          # do NOT return OTPs in prod responses
        value: "false"
      - key: RESEND_API_KEY        # email OTP delivery
        sync: false
      - key: FIREBASE_PROJECT_ID   # Google/Apple sign-in token verification
        sync: false
      # Optional: lock CORS to your admin URL once Vercel is deployed
      # - key: ALLOWED_ORIGINS
      #   value: https://your-admin.vercel.app

databases:
  - name: farmfresh-db
    plan: free
    databaseName: farmfresh
